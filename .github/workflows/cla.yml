name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the CLA signature
        # Runs on every pull request, and on the two comments the bot listens for.
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on their own branch so they never appear in a diff.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Arex95/ziva/blob/main/CLA.md
          # Bots and the maintainer do not sign.
          allowlist: Arex95,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thank you for this contribution. Before it can be merged, please read
            the [Contributor Licence Agreement](https://github.com/Arex95/ziva/blob/main/CLA.md)
            and sign it by replying to this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >-
            CLA signed. Thank you — this applies to every contribution you make
            from now on, so you will not be asked again.
